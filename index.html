<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PairCode</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8ecf7;font:15px system-ui}header{padding:18px 5%;background:#121a30;display:flex;justify-content:space-between}.brand{font-size:21px;font-weight:800}main{max-width:1100px;margin:25px auto;padding:0 18px}.bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}input,select,button{padding:10px;border-radius:8px;border:1px solid #35415f;background:#17223c;color:#e8ecf7}button{background:#5268e8;border:0;cursor:pointer}textarea{width:100%;height:65vh;background:#080d19;color:#d9e5ff;border:1px solid #34415e;border-radius:12px;padding:18px;font:14px/1.6 monospace}.muted{color:#a7b2cc;font-size:13px}.status{display:flex;justify-content:space-between;padding:10px 2px}</style></head><body>
<header><div class="brand">⌘ PairCode</div><span class="muted">Real-time collaborative editor</span></header><main>
<div class="bar"><label>Room <input id="room" value="team-room"></label><label>Name <input id="name" value="Guest"></label><button id="join">Join room</button><button id="invite">Copy invite link</button><select><option>Python</option><option>JavaScript</option><option>Java</option><option>C++</option></select></div>
<textarea id="editor" spellcheck="false"># Welcome to PairCode
def hello():
    print("Hello, collaborators!")
</textarea><div class="status"><span id="state">Connecting…</span><span id="users">0 collaborators</span></div>
<p class="muted">MVP limitation: last-write-wins document snapshots; simultaneous edits may overwrite one another. No CRDT/OT, authentication, or persistent storage yet.</p></main><script>
const ed=document.querySelector('#editor');let ws,timer,remote=false;
function join(){if(ws)ws.close();let room=document.querySelector('#room').value.trim().replace(/[^\w-]/g,'')||'team-room';ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${room}`);
ws.onopen=()=>document.querySelector('#state').textContent='Connected · '+room;ws.onclose=()=>document.querySelector('#state').textContent='Disconnected';
ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='init'){if(m.code)ed.value=m.code;users(m.users)}if(m.type==='presence')users(m.users);if(m.type==='code'){remote=true;let p=ed.selectionStart;ed.value=m.code;ed.setSelectionRange(Math.min(p,ed.value.length),Math.min(p,ed.value.length));remote=false}};
}
function users(n){document.querySelector('#users').textContent=`${n||0} collaborator${n===1?'':'s'}`}
ed.oninput=()=>{if(remote||!ws||ws.readyState!==1)return;clearTimeout(timer);timer=setTimeout(()=>ws.send(JSON.stringify({type:'code',code:ed.value})),150)};
document.querySelector('#join').onclick=join;document.querySelector('#invite').onclick=()=>{let u=new URL(location.href);u.searchParams.set('room',document.querySelector('#room').value);navigator.clipboard.writeText(u.href).then(()=>alert('Invite link copied'))};
let q=new URLSearchParams(location.search);if(q.has('room'))document.querySelector('#room').value=q.get('room');join();
</script></body></html>
